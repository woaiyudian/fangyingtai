<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>外卖之富 - 短剧粉丝站</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#141418;
  color:#f5f5f5;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:16px;
  max-width:680px;
  margin:0 auto;
  min-height:100vh;
}
h1{
  text-align:center;
  color:#ffaa2b;
  margin-bottom:20px;
  font-size:22px;
  font-weight:700;
}
.section-title{
  font-size:15px;
  color:#999;
  margin:20px 0 10px;
  padding-left:4px;
  border-left:3px solid #ff8822;
  padding-left:10px;
}
.tip{font-size:13px;color:#999;margin:8px 0;line-height:1.5;}
.card{
  background:#1f1f27;
  border-radius:12px;
  padding:18px;
  margin-bottom:14px;
  border:1px solid #2e2e3a;
}
.drama-home-card{
  background:#1f1f27;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:16px;
  border:1px solid #2e2e3a;
  cursor:pointer;
}
.drama-home-cover{
  width:100%;
  height:220px;
  object-fit:cover;
  display:block;
}
.drama-home-info{
  padding:14px;
}
.drama-home-name{
  font-size:18px;
  font-weight:bold;
  color:#ffaa2b;
  margin-bottom:6px;
}
.drama-home-desc{
  font-size:13px;
  color:#aaa;
  line-height:1.5;
}
#dramaDetailPage{
  display:none;
}
.detail-top-cover{
  width:100%;
  height:240px;
  object-fit:cover;
  border-radius:12px;
}
.detail-name{
  font-size:20px;
  color:#ffaa2b;
  font-weight:bold;
  margin:12px 0 6px;
}
.detail-desc{
  color:#aaa;
  font-size:14px;
  line-height:1.5;
  margin-bottom:14px;
}
.back-btn{
  background:#3a3a48;
  color:#fff;
  border:none;
  padding:10px 14px;
  border-radius:8px;
  margin-bottom:12px;
  cursor:pointer;
}
.ep-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:14px;
}
.ep-item{
  background:#242430;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
}
.ep-cover{
  width:100%;
  height:110px;
  object-fit:cover;
  display:block;
}
.ep-label{
  text-align:center;
  padding:6px 4px;
  font-size:13px;
}
input{
  width:100%;
  padding:12px 14px;
  border-radius:8px;
  border:1px solid #3a3a48;
  background:#2c2c38;
  color:#fff;
  margin-bottom:10px;
  font-size:16px;
  outline:none;
}
input:focus{border-color:#ff8822;}
button{
  padding:12px 16px;
  border:none;
  border-radius:8px;
  background:#ff8822;
  color:#000;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  margin-right:8px;
  margin-bottom:8px;
  transition:opacity .2s;
}
button:hover{opacity:.9;}
button.sec{background:#3a3a48;color:#fff;}
.rank-item{
  padding:10px 0;
  border-bottom:1px solid #2e2e3a;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:14px;
}
.rank-item:last-child{border-bottom:none;}
.rank-num{
  display:inline-block;
  width:24px;
  height:24px;
  line-height:24px;
  text-align:center;
  border-radius:50%;
  background:#3a3a48;
  margin-right:10px;
  font-size:12px;
}
.rank-item.top1 .rank-num{background:#ffd700;color:#000;}
.rank-item.top2 .rank-num{background:#c0c0c0;color:#000;}
.rank-item.top3 .rank-num{background:#cd7f32;color:#000;}
#msg{
  padding:12px;
  border-radius:8px;
  margin:10px 0;
  display:none;
}
.msg-ok{background:#1b3b2c;color:#99ffaa;}
.msg-err{background:#4b2727;color:#ffaaaa;}
.empty{text-align:center;color:#888;padding:20px 0;}
.me-points{font-size:20px;color:#ffaa2b;font-weight:700;}
#adminSection{display:none;}

<script>
// ✅ 放在最前面，修复时区签到BUG
function getLocalDateStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// ========== 你给的这段原样保留，一点没改 ==========
const DRAMA_LIST = [
  {
    dramaId: "drama01",
    name: "外卖之富",
    desc: "外卖小哥意外获得暴富系统，从此走上人生巅峰",
    dramaCover: "https://id5uuto33o40lc.1yunpan.com/%E5%A4%96%E5%8D%96%E4%B9%8B%E5%AF%8C/%E5%B0%81%E9%9D%A2/%E5%A4%96%E5%8D%96%E4%B9%8B%E5%AF%8C.png",
    feedbackUrl: "https://yfdexmbo.jsjform.com/f/ytLqvX",
    episodeList: [
      {

        videoSrc:"https://4001418454.share.123pan.cn/123pan/JSWZMh-GFns3"

  }

let currentDrama = null;

function openVideoModal(src){
  window.open(src,"_blank");
}

function renderHomeDrama(){
  const box = document.getElementById("dramaHomeList");
  let html = "";
  DRAMA_LIST.forEach(drama=>{
    html += `<div class="drama-home-card" onclick="openDramaDetail('${drama.dramaId}')">
      <img class="drama-home-cover" src="${drama.dramaCover}" alt="${drama.name}">

function backHome(){

const API_URL = "https://famruqybqslcslkckpyk.supabase.co/rest/v1";
const API_KEY = "sb_publishable_iie6HBAS9jm48lD7zZ3Zug_CgXYXVLf";
let userId = localStorage.getItem("waiman_uid") || null;
const headers = {
  "apikey": API_KEY,
  "Authorization": "Bearer " + API_KEY,
  "Content-Type": "application/json"
};

async function apiFetch(url, options = {}, retryCount = 2) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 10000);
  try {
    const res = await fetch(url, {
      ...options,
      headers: headers,
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    return res;
  } catch(e) {
    clearTimeout(timeoutId);
    if(retryCount > 0) {
      await new Promise(r => setTimeout(r, 1000));
      return apiFetch(url, options, retryCount - 1);
    }
    throw e;
  }
}

function showMsg(text, isOk) {
  const box = document.getElementById("msg");
  box.innerText = text;
  box.className = isOk ? "msg-ok" : "msg-err";
  box.style.display = "block";
  setTimeout(()=>{ box.style.display="none"; }, 3000);
}

async function testDb() {
  showMsg("正在测试连接...", true);
  try {
    const res = await apiFetch(API_URL + "/users?select=id&limit=1", {});
    if(res.ok) {
      const data = await res.json();
      showMsg("数据库连接成功！当前有 " + data.length + " 条数据", true);
    } else {
      showMsg("连接失败，错误码：" + res.status, false);
    }
  } catch(e) {
    showMsg("连接失败：" + e.message, false);
  }
}

const ADMIN_PASSWORD = "woaiyudian0325";
let adminUserList = [];
let editingUserId = null;

function showAdminLogin() {
  const pwd = prompt("请输入管理员密码：");
  if(pwd === ADMIN_PASSWORD) {
    document.getElementById("adminSection").style.display = "block";
    loadAdminList();
    loadPending();
    showMsg("管理员模式已开启", true);
  } else if(pwd !== null) {
    showMsg("密码错误！", false);
  }
}

function logoutAdmin() {
  document.getElementById("adminSection").style.display = "none";
  document.getElementById("editPanel").style.display = "none";
  editingUserId = null;
}

async function loadAdminList() {
  try {
    const res = await apiFetch(API_URL + "/users?select=id,nickname,points&order=points.desc", {});
    adminUserList = await res.json();
    renderAdminList();
  } catch(e) { showMsg("加载用户列表失败", false); }
}

function renderAdminList() {
  const keyword = document.getElementById("searchInput").value.trim();
  let list = adminUserList;
  if(keyword) list = list.filter(u => u.nickname.includes(keyword));
  const box = document.getElementById("adminUserList");
  if(list.length ===0){ box.innerHTML='<div class="empty">没有找到用户</div>';return; }
  let html="";
  list.forEach(u=>{
    html +=`<div class="rank-item" style="cursor:pointer;" onclick="editUser('${u.id}','${u.nickname}',${u.points})">
    <span>${u.nickname}</span><span style="color:#ffaa2b;font-weight:600;">${u.points}分</span></div>`;
  });
  box.innerHTML=html;
}

function editUser(id,name,points){
  editingUserId=id;
  document.getElementById("editUserName").innerText="用户："+name;
  document.getElementById("editUserPoints").innerText=points;
  document.getElementById("pointsInput").value="";
  document.getElementById("editPanel").style.display="block";
}

function closeEdit(){
  document.getElementById("editPanel").style.display="none";editingUserId=null;
}

async function savePoints(){
  if(!editingUserId) return;
  const change=parseInt(document.getElementById("pointsInput").value);
  if(isNaN(change)){ showMsg("请输入数字！",false);return; }
  const res=await apiFetch(API_URL+"/users?select=points&id=eq."+editingUserId,{});
  const data=await res.json();
  if(!data||data.length===0){showMsg("用户不存在",false);return;}
  const newPoints=data[0].points+change;
  const res2=await apiFetch(API_URL+"/users?id=eq."+editingUserId,{method:"PATCH",body:JSON.stringify({points:newPoints})});
  if(res2.ok){
    showMsg("修改成功！"+(change>=0?"加":"减")+Math.abs(change)+"分",true);
    closeEdit();loadAdminList();loadRank();refreshMyPoint();
  }else showMsg("修改失败",false);
}

async function applyPoints() {
  if(!userId){ showMsg("请先入场登记昵称！",false);return; }
  const nick=document.getElementById("nickInput").value.trim();
  try{
    const res=await apiFetch(API_URL+"/point_requests",{method:"POST",body:JSON.stringify({user_id:userId,nickname:nick,points:60,reason:"填完问卷领积分",status:"pending"})});
    if(res.ok) showMsg("申请已提交！等待站长审核通过后到账",true);
    else showMsg("提交失败，请重试",false);
  }catch(e){showMsg("网络错误，提交失败",false);}
}

async function loadPending(){
  try{
    const res=await apiFetch(API_URL+"/point_requests?select=*&status=eq.pending&order=created_at.desc",{});
    const data=await res.json();
    const box=document.getElementById("pendingList");
    if(!data||data.length===0){box.innerHTML='<div class="empty">暂无待审核申请</div>';return;}
    let html="";
    data.forEach(item=>{
      html+=`<div style="background:#272735;padding:10px;border-radius:6px;margin:6px 0;">
      <div style="font-weight:600;margin-bottom:4px;">${item.nickname}</div>
      <div style="font-size:13px;color:#999;margin-bottom:6px;">申请+${item.points}分｜${item.reason}</div>
      <button style="background:#22cc66;color:#000;padding:6px 12px;font-size:13px;" onclick="approveRequest('${item.id}','${item.user_id}',${item.points})">通过</button>
      <button class="sec" style="padding:6px 12px;font-size:13px;" onclick="rejectRequest('${item.id}')">拒绝</button>
      </div>`;
    });
    box.innerHTML=html;
  }catch(e){document.getElementById("pendingList").innerHTML='<div class="empty">加载失败</div>';}
}

async function approveRequest(reqId,uid,points){
  await apiFetch(API_URL+"/point_requests?id=eq."+reqId,{method:"PATCH",body:JSON.stringify({status:"approved"})});
  const res=await apiFetch(API_URL+"/users?select=points&id=eq."+uid,{});
  const data=await res.json();
  if(data&&data.length>0){
    const newPoints=data[0].points+points;
    await apiFetch(API_URL+"/users?id=eq."+uid,{method:"PATCH",body:JSON.stringify({points:newPoints})});
  }
  showMsg("已通过！给用户加了"+points+"分",true);
  loadPending();loadAdminList();loadRank();
}

async function rejectRequest(reqId){
  await apiFetch(API_URL+"/point_requests?id=eq."+reqId,{method:"PATCH",body:JSON.stringify({status:"rejected"})});
  showMsg("已拒绝",true);loadPending();
}

async function registerNick() {
  const nick=document.getElementById("nickInput").value.trim();
  if(!nick){showMsg("昵称不能为空",false);return;}
  try{
    const res=await apiFetch(API_URL+"/users?select=id,points&nickname=eq."+encodeURIComponent(nick),{});
    if(!res.ok){showMsg("数据库连接失败（错误码："+res.status+"）",false);return;}
    const data=await res.json();
    if(data&&data.length>0){
      userId=data[0].id;localStorage.setItem("waiman_uid",userId);
      showMsg("欢迎回来："+nick,true);refreshMyPoint();loadRank();return;
    }
    const res2=await apiFetch(API_URL+"/users",{method:"POST",body:JSON.stringify({nickname:nick,points:0})});
    if(!res2.ok){const err=await res2.text();showMsg("注册失败("+res2.status+")："+err.substring(0,50),false);return;}
    const data2=await res2.json();
    if(!data2||data2.length===0){showMsg("注册失败：返回数据为空",false);return;}
    userId=data2[0].id;localStorage.setItem("waiman_uid",userId);
    showMsg("注册成功！欢迎「"+nick+"」",true);refreshMyPoint();loadRank();
  }catch(e){showMsg("网络错误："+e.message,false);}
}

async function refreshMyPoint() {
  if(!userId) return;
  const res=await apiFetch(API_URL+"/users?select=nickname,points,last_checkin&id=eq."+userId,{});
  const data=await res.json();
  if(!data||data.length===0){showMsg("读取积分失败",false);return;}
  const me=data[0];
  document.getElementById("myInfo").innerHTML=`昵称：${me.nickname}<br>积分：<span class="me-points">${me.points}</span>`;
  const today = getLocalDateStr();
  const tipBox=document.getElementById("checkinTip");
  tipBox.innerText= me.last_checkin===today?"今天已经签到过啦，明天再来吧！":"";
}

async function dailyCheckin() {
  if(!userId){showMsg("请先入场登记昵称！",false);return;}
  const today = getLocalDateStr();
  const res=await apiFetch(API_URL+"/users?select=points,last_checkin&id=eq."+userId,{});
  const data=await res.json();
  if(!data||data.length===0){showMsg("读取失败，请刷新重试",false);return;}
  const user=data[0];
  if(user.last_checkin===today){showMsg("今天已经签到过了，明天再来吧！",false);return;}
  const newPoints=user.points+10;
  const res2=await apiFetch(API_URL+"/users?id=eq."+userId,{method:"PATCH",body:JSON.stringify({points:newPoints,last_checkin:today})});
  if(res2.ok){
    showMsg("签到成功！+10积分",true);
    refreshMyPoint();
    loadRank();
  }
  else showMsg("签到失败，请重试",false);
}

async function exchange(type){
  if(!userId){showMsg("请先入场登记昵称！",false);return;}
  let cost,title;
  if(type==="urge"){cost=100;title="兑换催更";}
  else if(type==="predict"){cost=30;title="剧情预测";}
  else return;
  const res=await apiFetch(API_URL+"/users?select=points&id=eq."+userId,{});
  const data=await res.json();
  if(!data||data.length===0){showMsg("读取积分失败",false);return;}
  const now=data[0].points;
  if(now<cost){showMsg("积分不足！还差"+(cost-now)+"分",false);return;}
  const newP=now-cost;
  const res2=await apiFetch(API_URL+"/users?id=eq."+userId,{method:"PATCH",body:JSON.stringify({points:newP})});
  if(!res2.ok){showMsg("兑换失败",false);return;}
  await apiFetch(API_URL+"/activities",{method:"POST",body:JSON.stringify({user_id:userId,action:title,change:-cost})});
  showMsg(title+"成功！",true);refreshMyPoint();loadRank();
}

function renderRankHTML(data){
  if(!data||data.length===0) return '<div class="empty">暂无玩家，快来当第一个！</div>';
  let html="";
  data.forEach((item,i)=>{
    let cls="";
    if(i===0)cls="top1";if(i===1)cls="top2";if(i===2)cls="top3";
    html+=`<div class="rank-item ${cls}"><span><span class="rank-num">${i+1}</span>${item.nickname}</span><span class="me-points">${item.points}</span></div>`;
  });
  return html;
}

async function loadRank() {
  const box=document.getElementById("rankBox");
  const cached=localStorage.getItem("waiman_rank");
  if(cached) box.innerHTML=renderRankHTML(JSON.parse(cached));
  else box.innerHTML='<div class="empty">加载中...</div>';
  try{
    const res=await apiFetch(API_URL+"/users?select=nickname,points&order=points.desc&limit=50",{});
    const data=await res.json();
    localStorage.setItem("waiman_rank",JSON.stringify(data));
    box.innerHTML=renderRankHTML(data);
  }catch(e){
    if(cached) box.innerHTML=renderRankHTML(JSON.parse(cached))+'<div style="text-align:center;font-size:12px;color:#888;margin-top:8px;">网络较慢，显示缓存榜单</div>';
    else box.innerHTML='<div class="empty">网络较慢，点上方刷新重试</div>';
  }
}

window.onload = ()=>{
  renderHomeDrama();
  loadRank();
  if(userId) refreshMyPoint();
};
</script>
